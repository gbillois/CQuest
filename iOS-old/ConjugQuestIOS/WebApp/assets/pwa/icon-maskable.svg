<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ConjugQuest maskable app icon</title>
  <desc id="desc">Maskable icon with central fantasy shield and CQ letters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f1d7f" />
      <stop offset="100%" stop-color="#7b1fd1" />
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd978" />
      <stop offset="100%" stop-color="#ffb347" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <path
    d="M256 116c-52 0-94 18-94 18v104c0 71 45 120 94 144 49-24 94-73 94-144V134s-42-18-94-18z"
    fill="url(#shield)"
    stroke="#fff4d1"
    stroke-width="8"
    stroke-linejoin="round"
  />
  <path
    d="M256 145c-35 0-64 13-64 13v77c0 50 30 86 64 104 34-18 64-54 64-104v-77s-29-13-64-13z"
    fill="#2d2a68"
  />
  <g fill="#ffe8a8" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-size="96" font-weight="900" text-anchor="middle">
    <text x="230" y="274">C</text>
    <text x="290" y="274">Q</text>
  </g>
</svg>
