<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ConjugQuest app icon</title>
  <desc id="desc">A fantasy shield with the letters CQ for ConjugQuest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f2b96" />
      <stop offset="100%" stop-color="#a339f7" />
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd978" />
      <stop offset="100%" stop-color="#ffb347" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1f1248" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)" />

  <g opacity="0.14" fill="#ffffff">
    <circle cx="110" cy="120" r="18" />
    <circle cx="154" cy="92" r="9" />
    <circle cx="400" cy="136" r="14" />
    <circle cx="368" cy="96" r="7" />
  </g>

  <g filter="url(#shadow)">
    <path
      d="M256 102c-63 0-115 23-115 23v127c0 87 56 147 115 173 59-26 115-86 115-173V125s-52-23-115-23z"
      fill="url(#shield)"
      stroke="#fff4d1"
      stroke-width="10"
      stroke-linejoin="round"
    />
    <path
      d="M256 138c-43 0-78 16-78 16v94c0 61 36 104 78 126 42-22 78-65 78-126v-94s-35-16-78-16z"
      fill="#2d2a68"
      opacity="0.95"
    />
  </g>

  <g fill="#ffe8a8" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-size="120" font-weight="900" text-anchor="middle">
    <text x="224" y="295">C</text>
    <text x="300" y="295">Q</text>
  </g>

  <path d="M256 64l20 30h35l-28 22 10 34-37-21-37 21 10-34-28-22h35z" fill="#fff6d6" opacity="0.9" />
</svg>
