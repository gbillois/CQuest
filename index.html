<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d2a68" />
    <title>ConjugQuest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="game-shell" aria-label="Vertical platformer game">
        <div class="game-viewport">
          <canvas id="gameCanvas" width="432" height="768"></canvas>

          <div class="hud">
            <div class="hud-info" aria-label="Top information">
              <div class="hud-item">
                <span class="hud-label">Score</span>
                <strong id="hudScoreValue">0</strong>
              </div>
              <div class="hud-item">
                <span class="hud-label">Heart</span>
                <strong id="hudLives">3</strong>
              </div>
              <div class="hud-item">
                <span class="hud-label">Gold</span>
                <strong id="hudGoldValue">0</strong>
              </div>
            </div>
            <div class="hud-actions">
              <button id="shopBtn" class="icon-button" aria-label="Open shop">
                <img id="shopIcon" alt="Shop" />
              </button>
              <button id="pauseBtn" class="icon-button" aria-label="Pause game">
                <img id="pauseIcon" alt="Pause" />
              </button>
            </div>
          </div>
        </div>

        <div class="controls-zone">
          <div class="touch-controls" aria-label="Touch controls">
            <button class="touch-btn" id="moveLeftBtn" aria-label="Move left">
              <img id="btnLeft" alt="Left" />
            </button>
            <button class="touch-btn" id="moveRightBtn" aria-label="Move right">
              <img id="btnRight" alt="Right" />
            </button>
            <button class="touch-btn" id="jumpBtn" aria-label="Jump"><img id="btnUp" alt="Jump" /></button>
          </div>
        </div>

        <aside class="panel" id="settingsPanel" hidden>
          <h1>Settings</h1>

          <label for="heroSelect">Hero</label>
          <select id="heroSelect"></select>

          <label for="levelSelect">Level</label>
          <select id="levelSelect"></select>

          <label for="difficultySelect">Difficulty</label>
          <select id="difficultySelect">
            <option value="normal">Normal</option>
            <option value="easy">Easy (No holes)</option>
          </select>

          <section class="pedagogy" id="pedagogyPanel">
            <h2>Conjugation Training</h2>
            <div id="groupFilters" class="check-grid"></div>
            <div id="tenseFilters" class="check-grid"></div>
            <div class="error-tools">
              <button id="resetErrorsBtn" class="secondary">Reset Errors</button>
            </div>
            <div id="errorList" class="error-list"></div>
          </section>

          <div class="panel-actions">
            <button id="applySettingsBtn">Apply</button>
            <button id="closeSettingsBtn" class="secondary">Close</button>
          </div>
        </aside>

        <aside class="panel question-panel" id="questionPanel" hidden>
          <h1>Duel de conjugaison</h1>
          <p id="questionPrompt" class="question-prompt"></p>
          <div id="answerButtons" class="answer-buttons"></div>
        </aside>

        <section id="titleScreen" class="title-screen">
          <div class="title-card">
            <p class="title-kicker">Plateformer horizontal</p>
            <h1>ConjugQuest</h1>
            <p>Traverse 5 biomes, bats les ennemis et ouvre le château final.</p>
            <div class="title-actions">
              <button id="startBtn" type="button">Start Game</button>
              <button id="openSettingsFromTitleBtn" type="button">Settings</button>
            </div>
          </div>
        </section>

        <section id="pauseModal" class="menu-modal hidden">
          <div class="menu-card">
            <h2>Pause</h2>
            <p>Game paused.</p>
            <div class="menu-actions">
              <button id="resumeBtn" type="button">Resume</button>
              <button id="openSettingsFromPauseBtn" type="button">Settings</button>
              <button id="backToTitleBtn" class="secondary-btn" type="button">Title Screen</button>
            </div>
          </div>
        </section>

        <section id="gameOverPanel" class="game-over hidden">
          <h2 id="gameOverTitle">Game Over</h2>
          <p id="gameOverText">You lost all hearts.</p>
          <p id="finalScoreText" class="final-score-text">Final score: 0</p>
          <p id="finalCoinsText" class="final-coins-text">Coins: 0</p>
          <div class="menu-actions">
            <button id="restartBtn" type="button">Restart Level</button>
            <button id="backToTitleFromGameOverBtn" class="secondary-btn" type="button">
              Title Screen
            </button>
          </div>
        </section>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
